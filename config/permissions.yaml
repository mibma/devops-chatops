default_roles:
  - viewer

permissions:

  admin:
    allowed_actions: ["*"]
    allowed_environments: ["*"]

  viewer:
    allowed_actions:
      - BUILD
      - STATUS
      - LOGS
      - RESTART
      - HELP
      - METRICS
      - INCIDENTS
      - CAPACITY
      - OPS
    allowed_environments: ["*"]

approval_channels:
  production_deployments: "#deployments-prod"
  rollbacks: "#sre-incidents"

approval_timeout_minutes: 15

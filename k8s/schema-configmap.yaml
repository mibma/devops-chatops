apiVersion: v1
kind: ConfigMap
metadata:
  name: chatops-schema
  namespace: devops-tools
data:
  01_users.sql: |
    CREATE TABLE IF NOT EXISTS user_roles (
        slack_user_id  VARCHAR(50) PRIMARY KEY,
        display_name   VARCHAR(100),
        email          VARCHAR(255),
        roles          TEXT[] NOT NULL DEFAULT '{}',
        created_at     TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at     TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

  02_audit_log.sql: |
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    CREATE TABLE IF NOT EXISTS audit_log (
        id              BIGSERIAL PRIMARY KEY,
        tracking_id     UUID NOT NULL DEFAULT gen_random_uuid(),
        timestamp       TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        user_id         VARCHAR(50) NOT NULL,
        username        VARCHAR(100),
        channel_id      VARCHAR(50) NOT NULL,
        action          VARCHAR(50) NOT NULL,
        service         VARCHAR(100),
        environment     VARCHAR(50),
        version         VARCHAR(100),
        raw_command     TEXT NOT NULL,
        parsed_intent   JSONB,
        outcome         VARCHAR(20) NOT NULL,
        outcome_detail  TEXT,
        duration_ms     INTEGER,
        approved_by     VARCHAR(50)
    );

    CREATE INDEX IF NOT EXISTS idx_audit_user      ON audit_log (user_id);
    CREATE INDEX IF NOT EXISTS idx_audit_timestamp ON audit_log (timestamp);
    CREATE INDEX IF NOT EXISTS idx_audit_service   ON audit_log (service);
    CREATE INDEX IF NOT EXISTS idx_audit_outcome   ON audit_log (outcome);

  03_operations.sql: |
    CREATE TABLE IF NOT EXISTS pending_operations (
        tracking_id      UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        initiated_by     VARCHAR(50) NOT NULL,
        action           VARCHAR(50) NOT NULL,
        payload          JSONB NOT NULL,
        status           VARCHAR(30) NOT NULL DEFAULT 'PENDING',
        approval_msg_ts  VARCHAR(50),
        approval_channel VARCHAR(50),
        approved_by      VARCHAR(50),
        created_at       TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        expires_at       TIMESTAMPTZ NOT NULL DEFAULT NOW() + INTERVAL '15 minutes',
        completed_at     TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_ops_status    ON pending_operations (status);
    CREATE INDEX IF NOT EXISTS idx_ops_initiator ON pending_operations (initiated_by);

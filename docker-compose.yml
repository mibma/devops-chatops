version: '3.9'

services:
  slack-gateway:
    build: ./slack-gateway
    ports:
      - "3000:3000"
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - orchestrator

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chatops:password@postgres:5432/chatops
      REDIS_URL: redis://redis:6379/0
      JENKINS_URL: ${JENKINS_URL}
      JENKINS_USER: ${JENKINS_USER}
      JENKINS_TOKEN: ${JENKINS_TOKEN}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      KUBECONFIG: /app/keys/k3s.yaml
      PERMISSIONS_FILE: /app/config/permissions.yaml
      EC2_TARGET_NAME: ${EC2_TARGET_NAME:-demo-devops-project}
      EC2_HTTP_URL: ${EC2_HTTP_URL:-}
      EC2_INSTANCE_ID: ${EC2_INSTANCE_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      EC2_SSH_HOST: ${EC2_SSH_HOST:-}
      EC2_SSH_USER: ${EC2_SSH_USER:-}
      EC2_SSH_KEY_PATH: ${EC2_SSH_KEY_PATH:-}
      EC2_SERVICE_NAME: ${EC2_SERVICE_NAME:-nginx}
      EC2_APP_DIR: ${EC2_APP_DIR:-~/app}
    volumes:
      - ~/.kube:/kube:ro
      - ./config:/app/config:ro
      - ./keys:/app/keys:ro
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatops
      POSTGRES_USER: chatops
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - orchestrator

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  prometheus_data:

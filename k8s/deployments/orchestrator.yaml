apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-orchestrator
  namespace: devops-tools
  annotations:
    chatops.io/managed-by: "chatops-bot"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chatops-orchestrator
  template:
    metadata:
      labels:
        app: chatops-orchestrator
    spec:
      serviceAccountName: chatops-bot
      containers:
        - name: orchestrator
          image: ACCOUNT_ID.dkr.ecr.ap-southeast-2.amazonaws.com/chatops/orchestrator:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: IN_CLUSTER
              value: "true"
            - name: PERMISSIONS_FILE
              value: "/app/config/permissions.yaml"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: redis-url
            - name: JENKINS_URL
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: jenkins-url
            - name: JENKINS_USER
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: jenkins-user
            - name: JENKINS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: jenkins-token
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: slack-bot-token
            - name: EC2_TARGET_NAME
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: ec2-target-name
            - name: EC2_HTTP_URL
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: ec2-http-url
            - name: EC2_INSTANCE_ID
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: ec2-instance-id
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: aws-region
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: aws-secret-access-key
            - name: EC2_SSH_HOST
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: ec2-ssh-host
            - name: EC2_SSH_USER
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: ec2-ssh-user
            - name: EC2_SSH_KEY_PATH
              value: "/app/keys/ec2.pem"
            - name: EC2_SERVICE_NAME
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: ec2-service-name
          volumeMounts:
            - name: permissions-config
              mountPath: /app/config
              readOnly: true
            - name: ec2-ssh-key
              mountPath: /app/keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: permissions-config
          configMap:
            name: chatops-permissions
        - name: ec2-ssh-key
          secret:
            secretName: chatops-ec2-key
            defaultMode: 0400

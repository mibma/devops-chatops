default_roles:
  - developer

permissions:
  developer:
    allowed_actions:
      - BUILD
      - DEPLOY
      - STATUS
      - LOGS
      - ROLLBACK
      - HELP
    allowed_environments:
      - development
      - staging
      - production

  devops-lead:
    allowed_actions:
      - BUILD
      - DEPLOY
      - STATUS
      - LOGS
      - RESTART
      - SCALE
      - HELP
    allowed_environments:
      - development
      - staging
      - production
    requires_approval:
      - action: ROLLBACK
        environment: production

  sre-on-call:
    allowed_actions: ["*"]
    allowed_environments: ["*"]

approval_channels:
  production_deployments: "#deployments-prod"
  rollbacks: "#sre-incidents"

approval_timeout_minutes: 15

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-slack-gateway
  namespace: devops-tools
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chatops-slack-gateway
  template:
    metadata:
      labels:
        app: chatops-slack-gateway
    spec:
      containers:
        - name: gateway
          image: registry.your-company.com/chatops-bot/slack-gateway:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: ORCHESTRATOR_URL
              value: "http://orchestrator-svc:8000"
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: slack-bot-token
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: slack-signing-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

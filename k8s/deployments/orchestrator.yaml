apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-orchestrator
  namespace: devops-tools
  annotations:
    chatops.io/managed-by: "chatops-bot"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chatops-orchestrator
  template:
    metadata:
      labels:
        app: chatops-orchestrator
    spec:
      serviceAccountName: chatops-bot
      containers:
        - name: orchestrator
          image: registry.your-company.com/chatops-bot/orchestrator:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: IN_CLUSTER
              value: "true"
            - name: PERMISSIONS_FILE
              value: "/app/config/permissions.yaml"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: redis-url
            - name: JENKINS_URL
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: jenkins-url
            - name: JENKINS_USER
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: jenkins-user
            - name: JENKINS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: jenkins-token
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chatops-secrets
                  key: slack-bot-token
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: permissions-config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: permissions-config
          configMap:
            name: chatops-permissions
